# GSC-MCP — Betrieb auf einem Host ([docs/01]). PostgreSQL + Anwendung + Sync-Worker.
# Caddy terminiert TLS davor (siehe deploy/Caddyfile) und proxyt auf 127.0.0.1:8080.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: gscmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: gscmcp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gscmcp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      # Innerhalb des Compose-Netzes zeigt DATABASE_URL auf den db-Dienst.
      DATABASE_URL: postgres://gscmcp:${POSTGRES_PASSWORD}@db:5432/gscmcp
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Nur lokal — Caddy ist die einzige öffentliche Fläche.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  worker:
    build: .
    command: ["npx", "tsx", "apps/worker/src/main.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://gscmcp:${POSTGRES_PASSWORD}@db:5432/gscmcp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
