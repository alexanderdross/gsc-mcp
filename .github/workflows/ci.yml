name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ddl:
    name: DDL gegen PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: psql bereitstellen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Schema aufbauen und funktional prüfen
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/citest
        run: node scripts/validate-ddl.mjs

  docs:
    name: Dokumente und Artefakt-Seite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-docs.mjs

  render:
    name: Artefakt-Seite rendern
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright-core
      - name: Chromium bereitstellen
        run: npx playwright-core install chromium --with-deps || npx playwright install chromium --with-deps
      - name: In beiden Themes rendern und auf Überlauf prüfen
        run: node scripts/render-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uebersicht-screenshots
          path: .render/
          if-no-files-found: ignore
